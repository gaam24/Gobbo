name: Release

# Builds the desktop app for Windows and Linux and publishes both archives as a GitHub release.
# Trigger: push a tag matching package.json (e.g. v0.2.0), or run manually from the Actions tab.
# The checks come from ci.yml, so a release does not lint or test the code a second time on its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to the tag, else package.json)"
        required: false
      dry_run:
        description: "Build and attest the archives, but do not publish a release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEFTHOOK: "0" # skip git hooks installed by the `prepare` script
  BUN_VERSION: "1.4.4"

jobs:
  # Release gate: a tag on a broken commit must not produce artifacts. The same checks run in ci.yml on every push.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      # A nightly E2E run is environment-dependent and takes ~16 min; it must not hold a release. The web, Rust and
      # Windows gates below are the release gate, and E2E still runs on its own nightly and manual schedule.
      e2e: false

  build:
    name: Build ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            portable: linux-x86_64-portable
          - os: windows-latest
            platform: windows-x86_64
            portable: windows-x86_64-portable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true # a release must not write a cache used to build published artifacts

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
          lookup-only: true # restore a cache, never write one from a release build

      # The release only restores this cache (save-if: false); it never writes one from published artifacts.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: src-tauri
          save-if: false

      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      # The input, else the tag, else package.json. The version must be semver and match package.json and tauri.conf.json,
      # because the archive names and the bundles both come from them.
      - name: Check release version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(jq -r .version package.json)"
          tauri_version="$(jq -r .version src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; fi
          version="${version:-$package_version}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid version: $version"
            exit 1
          fi
          if [ "$version" != "$package_version" ] || [ "$version" != "$tauri_version" ] || [ "$version" != "$cargo_version" ]; then
            echo "::error::version $version does not match package.json ($package_version), src-tauri/tauri.conf.json ($tauri_version) and src-tauri/Cargo.toml ($cargo_version)"
            exit 1
          fi

      - name: Install the 32-bit Rust target
        if: runner.os == 'Windows'
        run: rustup target add i686-pc-windows-msvc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--updater` signs the updater archive with the release key and refuses to run without it. The build then runs
      # `tauri build` and packs dist-release/*.zip.
      - name: Build and pack
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lets the AppImage tool run without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun scripts/build-release.ts --updater

      # The portable archive has no installer, so it is signed here as a file and its fragment is staged. The archive
      # itself is already in dist-release/*.zip and goes to the release with the other archives.
      - name: Sign and stage the portable archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist-release/gobbo-*-portable.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected one portable archive in dist-release, found ${#archives[@]}"
            exit 1
          fi
          bun run tauri signer sign "${archives[0]}"
          bun scripts/updater-manifest.ts stage-archive "${archives[0]}" dist/updater "${{ matrix.portable }}"

      - name: SBOM and third-party notices
        run: |
          set -euo pipefail
          bun run sbom
          mv target/sbom/sbom.cdx.json "target/sbom/sbom-${{ runner.os }}.cdx.json"
          mv target/sbom/THIRD-PARTY-NOTICES.md "target/sbom/THIRD-PARTY-NOTICES-${{ runner.os }}.md"

      - name: Attest the archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist-release/*.zip

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archive-${{ runner.os }}
          path: dist-release/*.zip
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ runner.os }}
          path: |
            target/sbom/sbom-*.cdx.json
            target/sbom/THIRD-PARTY-NOTICES-*.md
          if-no-files-found: error

      # The signed updater archive and its fragment. The publish job merges both platforms into latest.json.
      - name: Stage the updater archive
        run: bun scripts/updater-manifest.ts stage src-tauri/target/release/bundle dist/updater "${{ matrix.platform }}"

      - name: Upload updater archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: updater-${{ matrix.platform }}
          path: dist/updater/
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true # a publish job must not write a cache used by another release

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sbom-*
          path: dist/sbom
          merge-multiple: true

      - name: Download updater archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: updater-*
          path: dist/updater
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; fi
          version="${version:-v$(jq -r .version package.json)}"
          version="${version#v}"
          # latest.json is the file the in-app updater reads from releases/latest. The merge fails unless both platforms
          # were built and signed, so an update never points at a platform without an installer.
          bun scripts/updater-manifest.ts merge dist/updater dist/latest.json "$version" "$GITHUB_REPOSITORY"
          assets=( dist/*.zip dist/SHA256SUMS.txt dist/sbom/* dist/latest.json dist/updater/*.nsis.zip dist/updater/*.AppImage.tar.gz )
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$version" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gobbo Mods Organizer v$version" \
              --generate-notes "${assets[@]}"
          fi
