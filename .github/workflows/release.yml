name: Release

# Push a tag `v<version>` on main (the version in release.json) to publish a release. A manual run builds and attests
# the same files but never publishes. The CI check and the two platform builds run in parallel, and the publish job
# waits for all of them, so a broken commit never gets a release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the updater signing key).
#
# Assets: the installers (NSIS setup on Windows, AppImage on Linux), the portable archives, latest.json for the in-app
# updater, SHA256SUMS.txt and the SBOMs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEFTHOOK: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  # The tag's commit is on main, where CI already ran; the release waits for that run instead of repeating it, which
  # saves a full Windows test run. A manual build has no gate: it never publishes.
  checks:
    name: CI passed
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' || true)"
            echo "CI: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::CI failed for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::no finished CI run for $GITHUB_SHA"
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag check needs the history of main

      - name: Tag is on main and matches release.json
        run: |
          set -euo pipefail
          version="$(jq -r .version release.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match release.json (v$version)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
              exit 1
            fi
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true # a release never writes a cache

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'Windows' && 'i686-pc-windows-msvc' || '' }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile

      # Builds the hook (Windows), the web bundle and the signed Tauri bundle, then packs the portable archive.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1" # the AppImage tool runs without FUSE on the runner
        run: bun scripts/build-release.ts --updater

      # The installer and the portable archive go to dist-release/ with a fragment each for latest.json.
      - name: Sign and stage the updater files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          portable="$(ls dist-release/gobbo-*-portable.zip)"
          bun run tauri signer sign "$portable"
          bun scripts/updater-manifest.ts stage-archive "$portable" dist-release "${{ matrix.platform }}-portable"
          bun scripts/updater-manifest.ts stage src-tauri/target/release/bundle dist-release "${{ matrix.platform }}"

      - name: SBOM and third-party notices
        run: |
          set -euo pipefail
          bun run sbom
          mv target/sbom/sbom.cdx.json "dist-release/sbom-${{ matrix.platform }}.cdx.json"
          mv target/sbom/THIRD-PARTY-NOTICES.md "dist-release/THIRD-PARTY-NOTICES-${{ matrix.platform }}.md"

      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/*.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.platform }}
          path: dist-release/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [checks, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # latest.json is what the in-app updater reads; the merge fails unless every platform was built and signed.
          bun scripts/updater-manifest.ts merge dist dist/latest.json "$version" "$GITHUB_REPOSITORY"
          rm dist/*.fragment.json
          (cd dist && sha256sum ./*.zip ./*.exe ./*.AppImage > SHA256SUMS.txt)
          prerelease=""
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
              --title "Gobbo Mods Organizer $GITHUB_REF_NAME" --generate-notes dist/*
          fi
