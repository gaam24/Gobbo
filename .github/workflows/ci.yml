name: CI

# Built to spend as few Actions minutes as possible (Windows minutes cost double):
#   changes   decides from the diff which jobs a push or pull request needs (a few seconds)
#   web       format, lint (types, guard and dead code), unit tests, web bundle
#   rust      Linux clippy and the full Rust suite
#   windows   clippy, overlay hook build and the Windows suite, in one job; it runs for any change under `src-tauri/`
#             (plus the hook build script), `games/` or `loaders/`, since any of it can behave differently on Windows
#             (definitions affect platform paths and shipped-game deploy tests). A push to main also runs it for any
#             Rust change, so main always has a Windows result.
# A run that a newer push replaces is cancelled. There is no nightly run; E2E runs only by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: "0" # skip the git hooks installed by the `prepare` script
  CARGO_INCREMENTAL: "0" # an incremental cache is never reused across runner jobs
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      rust: ${{ steps.diff.outputs.rust }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all() { for name in web rust windows; do echo "$name=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          # A manual run, a new branch or a force push without a usable base checks everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then all; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$files"
          has() { grep -qE "$1" <<< "$files"; }
          workflow='^\.github/workflows/ci\.yml$'
          web=false; rust=false; windows=false
          # Web reads the code and tool configs it checks, the Rust sources (fmt + guard), the game/loader data and
          # generated files (guard), and Vite's HTML entry. Biome excludes Markdown and no step reads Markdown, images,
          # the license or docs-only files, so those skip the web job.
          web_sources='^src/|^scripts/|^e2e/|^src-tauri/|^games/|^loaders/|^catalog\.json$|^release\.json$|^index\.html$|^\.gitignore$|^package\.json$|^bun\.lock$|^biome\.jsonc$|^\.oxlintrc\.json$|^tsconfig|^knip\.json$|^vite\.config\.ts$|^components\.json$|^rust-toolchain\.toml$|^lefthook\.yml$'
          if has "$web_sources|$workflow"; then web=true; fi
          if has "^src-tauri/|^games/|^loaders/|$workflow"; then rust=true; fi
          # Windows compiles the whole Rust workspace, so any src-tauri change can expose a platform difference.
          if has "^src-tauri/|^games/|^loaders/|^scripts/build-overlay-hook\.ts$|$workflow"; then
            windows=true
          fi
          if [ "$EVENT" = push ] && [ "$rust" = true ]; then windows=true; fi
          { echo "web=$web"; echo "rust=$rust"; echo "windows=$windows"; } | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # rustfmt only: formatting needs neither the system libraries nor a compiled workspace.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint, types and architecture guard
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Web bundle
        run: bun run build:web

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0" # no debug info: faster links and a much smaller cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The overlay session tests need unprivileged user namespaces; without them they skip themselves.
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace --features bench --locked

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only # the hook keeps a PDB with names and lines, but links much faster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: i686-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The runner's default TEMP is the 8.3 form `C:\Users\RUNNER~1\...`. The overlay tests build their game folders
      # under TEMP, and a game folder spelled in 8.3 names is a known gap of the hook (see the hook's ARCHITECTURE.md,
      # section 10). `RUNNER_TEMP` is a long path on the same machine.
      - name: Use a long-name temporary folder
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # The same script developers run: both hooks, the 32-bit injector, the probes and the dumper, staged where the
      # bundle and the tests look for them. It needs no node_modules. Clippy needs the staged files too: tauri-build
      # checks that the bundle resources exist.
      - name: Build the overlay binaries
        run: bun scripts/build-overlay-hook.ts

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace --features bench --locked

  e2e:
    name: E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: "1" # WebKitGTK under Xvfb has no DMA-BUF renderer
      CARGO_PROFILE_DEV_DEBUG: "0" # same dev profile as the Rust job, so the shared cache artifacts are reusable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # WebdriverIO's expect-webdriverio does not run under Bun; the suite uses this Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The pinned action uses `shared-key` *instead of* the job-based key, so the same key plus the same dev-profile
      # debug setting gives an identical cache key to the Rust job. E2E only restores: saving would overwrite the Linux
      # cache with `--features e2e` artifacts. The e2e-specific code still compiles locally on a cold restore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: linux
          save-if: false

      - name: Build the E2E app
        run: bun run e2e:build

      - name: Run E2E
        run: xvfb-run -a bun run e2e

      - name: Upload E2E data
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-data
          path: |
            target/e2e-data
            target/e2e-artifacts
          if-no-files-found: ignore
