name: CI

# Four independent jobs run in parallel, so the wall time is the slowest one (Windows tests), not the sum:
#   web            format, lint, architecture guard, unit tests, web bundle
#   rust           Linux clippy and the full Rust test suite
#   windows-clippy clippy for the Windows-only code (placeholder hook resources, nothing is linked)
#   windows-test   builds the overlay hook binaries once, then runs the Windows test suite
# The E2E suite is long and environment-dependent: it runs nightly and on demand, never as a gate.
# Rust caches are written only from main; pull requests restore them.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call: # the release gate (release.yml)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: "0" # skip the git hooks installed by the `prepare` script
  CARGO_INCREMENTAL: "0" # an incremental cache is never reused across runner jobs
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # rustfmt only: formatting needs neither the system libraries nor a compiled workspace.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint, types and architecture guard
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Web bundle
        run: bun run build:web

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0" # no debug info: faster links and a much smaller cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The overlay session tests need unprivileged user namespaces; without them they skip themselves.
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace --features bench --locked

  windows-clippy:
    name: Windows clippy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: windows-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri-build only checks that the bundle resources exist; clippy links nothing, so empty files are enough.
      - name: Placeholder hook resources
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p overlay-hook
          for file in $(jq -r '.bundle.resources | keys[]' tauri.windows.conf.json); do touch "$file"; done

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: windows-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runner's default TEMP is the 8.3 form `C:\Users\RUNNER~1\...`. The overlay tests build their game folders
      # under TEMP, and a game folder spelled in 8.3 names is a known gap of the hook (see the hook's ARCHITECTURE.md,
      # section 10). `RUNNER_TEMP` is a long path on the same machine.
      - name: Use a long-name temporary folder
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # The same script developers run: both hooks, the 32-bit injector, the probes and the dumper, staged where the
      # bundle and the tests look for them. The script needs no node_modules.
      - name: Build the overlay binaries
        run: bun scripts/build-overlay-hook.ts

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace --locked

  e2e:
    name: E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: "1" # WebKitGTK under Xvfb has no DMA-BUF renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # WebdriverIO's expect-webdriverio does not run under Bun; the suite uses this Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the E2E app
        run: bun run e2e:build

      - name: Run E2E
        run: xvfb-run -a bun run e2e

      - name: Upload E2E data
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-data
          path: |
            target/e2e-data
            target/e2e-artifacts
          if-no-files-found: ignore
