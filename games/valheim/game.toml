# Valheim. A Unity game with BepInEx 5 plugins; see `loaders/bepinex.toml`.
#
# BepInEx comes from an enabled mod. The shared layout is the `bepinex` loader preset in loaders/bepinex.toml: the
# proxy and settings at the root, the plugin slot, the core/config/patchers/monomod mirrors and the archive aliases.
# The game also has a native Linux build. Gobbo finds that install through its Linux marker and starts it directly;
# the Windows program stays for installs that run under Proton.

schema = 1
id = "valheim"
name = "Valheim"
providers = { nexus = { key = "valheim" }, thunderstore = { key = "valheim" } }
loader = "bepinex"

[detect]
steam_app_ids = [892970]
steam_install_dirs = ["Valheim"]
# The Windows build and the native Linux build are both found; each install starts the program it has.
markers = ["valheim.exe"]
linux_markers = ["valheim.x86_64"]
any_marker = true

[[executables]]
name = "Valheim"
path = "valheim.exe"
path_linux = "valheim.x86_64"

[[user_data]]
# Not yet verified on a real installation. Unity keeps the saves here on Windows, under Proton and on native Linux.
id = "saves"
kind = "saves"
path = "{local_low}/IronGate/Valheim"
path_linux = "{home}/.config/unity3d/IronGate/Valheim"
