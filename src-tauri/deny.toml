# Dependency policy for `cargo deny check`. The app is GPL-3.0-only, so every dependency must be compatible with it.
# Run from this folder: `cargo deny check`.

[graph]
# Check every target the workspace builds; Windows-only crates must be seen too.
targets = []

[advisories]
version = 2
yanked = "warn"
# Transitive build-time macros and the Linux Secret Service stack of `keyring`; no runtime code of Gobbo is affected, and
# the replacements need an upstream release. Recheck at each release, next 2026-12-12.
ignore = [
  "RUSTSEC-2024-0436", # paste: build-time macro
  "RUSTSEC-2024-0370", # proc-macro-error: build-time macro
  "RUSTSEC-2025-0141", # bincode 1: the iai-callgrind runner on Linux CI, not the app
  "RUSTSEC-2026-0173", # proc-macro-error2: iai-callgrind macros, build-time
  "RUSTSEC-2026-0370", # zvariant: keyring on Linux, no safe upgrade yet
  "RUSTSEC-2026-0371", # zbus_names: keyring on Linux
  "RUSTSEC-2026-0372", # zvariant_derive: keyring on Linux
]

[licenses]
version = 2
# A dependency with another license needs a note here and a reason in the change that adds it.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "LGPL-2.1-only",
  "LGPL-3.0-only",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
