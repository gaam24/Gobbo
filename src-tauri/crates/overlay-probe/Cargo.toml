[package]
name = "gobbo-overlay-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A small program that checks the Windows overlay hook end to end from inside a session."
publish = false

[[bin]]
name = "overlay-probe"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The report types are plain data and are read by Gobbo on every platform, not only where the probe binary runs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
gobbo-overlay-core.workspace = true
