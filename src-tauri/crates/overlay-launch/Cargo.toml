[package]
name = "gobbo-overlay-launch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Starts a Windows program suspended, redirects the static imports that come from the overlay layer, loads the hook before the first instruction and resumes it. Windows only; empty elsewhere."
publish = false

[[bin]]
name = "gobbo_overlay_inject32"
path = "src/bin/inject32.rs"

[target.'cfg(windows)'.dependencies]
# The handover grammar is shared with the hook.
gobbo-overlay-core.workspace = true
# Used only by the Windows-gated `static_imports` module, which parses the program's PE imports.
gobbo-overlay-pe.workspace = true
# Decodes the first instructions of a loader stub. The same crate is already in the lock file through `detour`.
iced-x86 = { version = "1.22", default-features = false, features = [
  "std",
  "decoder",
] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

# The overlay crates deliberately stay out of the workspace lint groups: the hook is Win32 code and the pedantic/nursery
# group would flood them with warnings (see ../AGENTS.md). An empty table is Cargo's documented way to make that intent
# explicit and silence the `missing_lints_inheritance` warning.
[lints]
