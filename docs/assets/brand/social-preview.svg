<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title">
  <title id="title">Gobbo: a mod manager for PC games that keeps your game folder clean</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101311"/>
      <stop offset="1" stop-color="#161B18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#23C385" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#23C385" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <image href="gobbo.png" x="80" y="96" width="160" height="160"/>
  <text x="288" y="196" font-family="Schibsted Grotesk, sans-serif" font-size="96" font-weight="700" fill="#FBFBFB">Gobbo</text>
  <text x="292" y="260" font-family="Schibsted Grotesk, sans-serif" font-size="32" fill="#C9D1D9">A mod manager for PC games that keeps</text>
  <text x="292" y="304" font-family="Schibsted Grotesk, sans-serif" font-size="32" fill="#C9D1D9">your game folder clean.</text>
  <text x="292" y="372" font-family="Schibsted Grotesk, sans-serif" font-size="26" fill="#23C385">Windows · Linux · Free and open source</text>
  <text x="80" y="560" font-family="Schibsted Grotesk, sans-serif" font-size="24" fill="#6E7A72">github.com/gaam24/Gobbo</text>
</svg>
