# Git hooks through lefthook (install with `bun run prepare`).
# Pre-commit fixes what is safe to fix; pre-push runs the full gates.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      # Generated by specta; .oxlintrc.json ignores it, and oxlint fails when every file it gets is ignored.
      exclude: "src/bindings.ts"
      run: bunx oxlint --type-aware {staged_files}

pre-push:
  commands:
    lint:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: bun run lint
    frontend-tests:
      glob: "*.{ts,tsx}"
      run: bun test
    backend:
      glob: "*.{rs,toml}"
      run: bun run check:rust
