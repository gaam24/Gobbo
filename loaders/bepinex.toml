# BepInEx, the loader of Unity games. A game takes the shared rules with `loader = "bepinex"` or, for the IL2CPP
# build, `loader = { id = "bepinex", variant = "6" }`.
#
# A loader preset carries only shared `requires`, `requirements`, `install` and `[deploy]` rules. The game owns its
# folder, detection, programs and tools.

schema = 1
id = "bepinex"
name = "BepInEx"
# Where an unpacked community profile keeps BepInEx's config files; the bare `config` folder is checked as well.
config_mirror = "BepInEx/config"
min_gobbo = "0.2.0"
default_variant = "5"

[deploy]
# The proxy and its settings, both in the game folder.
root_files = ["winhttp.dll", "doorstop_config.ini"]

# Archive folders that stand for the BepInEx folders. Many packages keep `plugins/` at the archive root, and some keep
# `patchers/` or `monomod/` there too.
[deploy.aliases]
plugins = "BepInEx/plugins"
core = "BepInEx/core"
config = "BepInEx/config"
patchers = "BepInEx/patchers"
monomod = "BepInEx/monomod"

# A plugin may be `BepInEx/plugins/<Mod>/<Mod>.dll`, a bare .dll at the archive root, or `<Mod>/<Mod>.dll` at the root.
[[deploy.slots]]
dir = "BepInEx/plugins"
root_extensions = [".dll"]
root_folder_extensions = [".dll"]

# The core, the settings a mod ships and the patches BepInEx reads. They keep their paths.
[[deploy.mirror]]
dir = "BepInEx/core"

[[deploy.mirror]]
dir = "BepInEx/config"

[[deploy.mirror]]
dir = "BepInEx/patchers"

[[deploy.mirror]]
dir = "BepInEx/monomod"

# How the editor recognises a Unity game that has no loader yet. Every marker must exist in the game folder; a marker
# with `|` accepts any of its names, so the Windows (.dll) and the native Linux (.so) build of one file both match. The
# first variant whose markers all exist wins, so IL2CPP (GameAssembly) comes before Mono; without a match the default is
# suggested.
[engine]
name = "Unity"
markers = ["UnityPlayer.dll|UnityPlayer.so", "*_Data"]

[[engine.variants]]
variant = "6"
label = "IL2CPP"
markers = ["GameAssembly.dll|GameAssembly.so"]

[[engine.variants]]
variant = "5"
label = "Mono"
markers = ["*_Data/Managed"]

# BepInEx 5 (Mono). The package is BepInEx's own release for 64-bit Windows; it is offered, never forced. Any enabled
# mod that ships the proxy and the core counts as the loader, so a build that a mod site publishes for one game (a
# Nexus or Thunderstore BepInEx pack) works just as well. The setup check lists every copy in the library and lets the
# user pick one or install the official release. `to` is empty: the release's root is the game folder.
[variants."5".install]
name = "BepInEx"
version = "5.4.23.6"
to = ""
check = ["winhttp.dll", "BepInEx/core/BepInEx.dll"]
url = "https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.6/BepInEx_win_x64_5.4.23.6.zip"
sha256 = "6c57a714a892efb4e9e1fef63d608a3391f30ec984031c465404e4ee381a0755"
size = 642076

# BepInEx 6 (IL2CPP) ships the .NET runtime next to the program, under dotnet/. It is still a pre-release whose core file
# names change between builds, and IL2CPP games usually need a bleeding-edge build, so this variant names no package:
# it requires only the proxy and links the download page.
[variants."6"]
[[variants."6".requirements]]
name = "BepInEx 6"
path = "winhttp.dll"
url = "https://github.com/BepInEx/BepInEx/releases"

[[variants."6".deploy.mirror]]
dir = "dotnet"
